<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>COUP — Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@500;700&display=swap">
<style>
:root{--bg:#070a10;--pan:#111924;--line:#2b3a4d;--ink:#e8eef6;--mut:#8b9bb0;--hot:#ff2d6f;--cy:#27e1ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:500 18px/1.3 Rajdhani,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:radial-gradient(1000px 500px at 50% -10%,#27e1ff1f,transparent),radial-gradient(800px 500px at 0 100%,#ff2d6f20,transparent),repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px),var(--bg)}
.wrap{max-width:1000px;margin:auto;padding:8px 12px 24px}
.lg{display:block;height:clamp(44px,8vw,72px);margin:6px auto 0;mix-blend-mode:screen}.lg.big{height:clamp(80px,18vw,150px);margin-top:18px}
.tag{text-align:center;color:var(--mut);letter-spacing:.3em;text-transform:uppercase;font-size:13px;margin:6px 0 18px}
.pan{background:linear-gradient(180deg,#16212f,var(--pan));border:1px solid var(--line);padding:14px;margin:12px 0;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);position:relative}
.pan:before{content:"";position:absolute;left:0;top:0;width:60px;height:3px;background:var(--hot)}
h3{font:700 14px Orbitron,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin:0 0 10px;color:var(--cy)}
input{background:#0a1018;border:1px solid var(--line);color:var(--ink);font:700 20px Rajdhani,sans-serif;padding:10px 12px;width:100%;letter-spacing:.08em}
input:focus{outline:2px solid var(--cy)}
.btn{font:700 14px Orbitron,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:#1b2838;border:0;padding:10px 15px;margin:4px 6px 4px 0;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover:not(:disabled){background:var(--hot);color:#fff}.btn.p{background:var(--hot)}.btn.c{background:#0e5d70}.btn.x{background:#7a1e33}
.btn:disabled{opacity:.35;cursor:not-allowed}.btn small{display:block;font:500 12px Rajdhani;text-transform:none;letter-spacing:.04em;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.grid{grid-template-columns:1fr}}
.mut{color:var(--mut)}.err{color:var(--hot);min-height:1.4em;text-align:center}
.say{font:700 20px Rajdhani;margin:0 0 8px}.say b{color:var(--hot)}
.log{max-height:150px;overflow:auto;font-size:16px;color:var(--mut)}.log div{padding:1px 0;border-bottom:1px dashed #ffffff10}.log div:last-child{color:var(--ink)}
.fan{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;--dy:-60px}
/* table */
.tbl{--W:min(100vw - 24px,980px);--H:clamp(460px,calc(var(--W)*.72),700px);width:var(--W);height:var(--H);margin:8px auto 0;position:relative}
@media(max-width:640px){.tbl{--H:calc(var(--W)*1.6)}}
.felt{position:absolute;inset:5% 3% 15%;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#2a4058,#0e1722 65%,#080d14);border:6px solid #1c2a3a;box-shadow:0 0 0 2px var(--cy),0 0 44px #27e1ff55,inset 0 0 90px #000,0 34px 60px #000c}
.felt:before{content:"";position:absolute;inset:3.5% 2.5%;border-radius:50%;border:1px dashed #27e1ff55;background:repeating-linear-gradient(60deg,#ffffff05 0 2px,transparent 2px 14px)}
.felt:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,#ffffff18,transparent 38%)}
.mid{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:46%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;z-index:2}
.piles{display:flex;gap:clamp(8px,3vw,28px);align-items:flex-end;justify-content:center}
.dk{display:flex;flex-direction:column;align-items:center;gap:4px}.dk small,.rvw small{font-size:13px;color:var(--mut);letter-spacing:.06em}
.deckp{position:relative;width:clamp(36px,6.5vw,58px);aspect-ratio:188/312;margin-bottom:4px}
.deckp .cd{position:absolute;left:0;top:0;width:100%}.deckp .cd:nth-child(2){transform:translate(3px,-3px)}.deckp .cd:nth-child(3){transform:translate(6px,-6px)}
.bn{font:700 clamp(14px,2.4vw,20px) Rajdhani;background:#050a10d0;border:1px solid var(--line);padding:3px 12px;max-width:100%}.bn b{color:var(--hot)}
.code{font:900 clamp(30px,8vw,56px) Orbitron,sans-serif;letter-spacing:.25em;color:var(--cy);text-shadow:0 0 22px #27e1ff99}
.win{font:900 clamp(22px,5vw,40px)/1.1 Orbitron;color:#ffcc33;text-shadow:0 0 24px #ffcc3388}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3}
.seat.me{left:50%;bottom:0;top:auto;transform:translateX(-50%)}.seat.out{opacity:.5}
.plate{font:700 11px Orbitron;letter-spacing:.06em;background:#0a121c;border:1px solid var(--line);padding:2px 9px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.turn .plate{border-color:var(--cy);color:var(--cy);box-shadow:0 0 16px var(--cy)}
.hr{display:flex;gap:10px;align-items:flex-end}.hand{display:flex;gap:6px}.seat:not(.me) .hand{gap:3px}
.stack{display:flex;gap:2px;align-items:flex-end}.col{display:flex;flex-direction:column-reverse}
.col i{width:17px;height:17px;border-radius:50%;margin-top:-11px;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb800 55%,#a56a00);border:1px solid #6a4200;box-shadow:0 2px 0 #0009}
.seat:not(.me) .col i{width:11px;height:11px;margin-top:-7px}
.stack b{font:900 13px Orbitron;color:#ffcc33;align-self:center;margin-left:4px}
/* cards */
.cd{width:clamp(92px,13vw,128px);aspect-ratio:188/312;perspective:900px;flex:none;position:relative}
.cd.sm{width:clamp(28px,5vw,46px)}.cd.md{width:clamp(88px,24vw,124px)}.cd.rv{width:clamp(56px,10vw,84px)}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d}.cd.down .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;border-radius:6%;overflow:hidden}
.fr{background-size:100% 100%;box-shadow:0 5px 12px #000b,0 0 0 1px #fff3}
.bk{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#0d141e 0 6px,#121e2d 6px 12px);border:2px solid var(--hot);display:grid;place-items:center;box-shadow:0 5px 12px #000b}
.bk span{font:900 clamp(10px,2.6vw,20px) Orbitron;letter-spacing:.12em;color:var(--hot);transform:rotate(-90deg);text-shadow:0 0 10px var(--hot)}.sm .bk span{font-size:8px}
.dead .fr{filter:grayscale(1) brightness(.4)}.dead:after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font:900 26px Orbitron;color:var(--hot)}
.pick{cursor:pointer;animation:pu 1s infinite alternate}@keyframes pu{to{filter:drop-shadow(0 0 14px var(--hot));transform:translateY(-8px)}}
.sel{transform:translateY(-12px);filter:drop-shadow(0 0 14px var(--cy))}[data-a=kp]{cursor:pointer}
.cd.deal{animation:fly .75s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--d,0s)}
@keyframes fly{from{transform:translate(var(--dx,0px),var(--dy,0px)) rotate(200deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
.cd.deal.mine .in{animation:fl .9s ease both;animation-delay:var(--f,0s)}@keyframes fl{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
</style></head><body><div class="wrap" id="app"></div>

const ACT={income:{l:'Income',s:'+1 coin'},aid:{l:'Foreign Aid',s:'+2 coins',b:['Duke']},coup:{l:'Coup',s:'pay 7 · target loses a card',cost:7,t:1},tax:{l:'Tax',s:'Duke · +3 coins',c:'Duke'},assassinate:{l:'Assassinate',s:'Assassin · pay 3',c:'Assassin',cost:3,t:1,b:['Contessa']},steal:{l:'Steal',s:'Captain · take 2',c:'Captain',t:1,b:['Captain','Ambassador']},exchange:{l:'Exchange',s:'Ambassador · swap cards',c:'Ambassador'}};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){}},ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const uid=ss('cu')||Math.random().toString(36).slice(2,10);ss('cu',uid);
let G,code,isHost=false,peer,hc,conns={},sel=null,keep=[],deal=false,myName=ls('cn')||'',msg='';
const P=id=>G.players.find(p=>p.id==id),live=p=>p.cards.filter(c=>!c.x),nm=id=>esc(P(id).name);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}};

const lg=s=>{G.log.push(s);G.log=G.log.slice(-40)};
function over(){const a=G.players.filter(p=>live(p).length);if(a.length<2){G.phase='over';G.win=a[0].id;G.pend=null;G.lose=null;lg(a[0].name+' seizes power!');return 1}}
function next(){G.rv=null;G.pend=null;G.lose=null;G.ex=null;if(over())return;do{G.turn=(G.turn+1)%G.players.length}while(!live(G.players[G.turn]).length)}
function lose(id,after){const p=P(id),l=live(p);if(l.length<2){if(l[0]){l[0].x=1;lg(p.name+' loses '+l[0].n)}fin(after)}else{G.lose=id;G.after=after}}
function fin(a){G.lose=null;if(over())return;const pd=G.pend;
 if(a=='end'||a=='bstand')next();
 else if(a=='bfail')exec();
 else if(a=='afail'){if(ACT[pd.act].cost)P(pd.actor).coins+=ACT[pd.act].cost;next()}
 else if(a=='cont'){pd.ch=1;pd.passed=[];pd.stage='decl';ACT[pd.act].b?0:exec()}}
function ready(){const pd=G.pend,who=pd.stage=='blk'?pd.blocker:pd.actor;
 if(G.players.filter(p=>live(p).length&&p.id!=who).every(p=>pd.passed.includes(p.id))){if(pd.stage=='blk'){lg('The block stands.');next()}else exec()}}
function exec(){const pd=G.pend,p=P(pd.actor),t=pd.target&&P(pd.target),a=pd.act;
 if(t&&!live(t).length){next();return}
 if(a=='income')p.coins++;if(a=='aid')p.coins+=2;if(a=='tax')p.coins+=3;
 if(a=='steal'){const n=Math.min(2,t.coins);t.coins-=n;p.coins+=n;lg(p.name+' steals '+n+' from '+t.name)}
 if(a=='exchange'){pd.stage='ex';G.ex=[...live(p).map(c=>c.n),G.deck.pop(),G.deck.pop()];return}
 if(a=='coup'||a=='assassinate'){lose(t.id,'end');return}
 next()}
function proc(i){const pd=G.pend,me=P(i.id),k=i.k;
 if(k=='join'){if(G.phase=='lobby'&&!me&&G.players.length<6)G.players.push({id:i.id,name:i.name,coins:2,cards:[]});return}
 if(!me)return;
 if(k=='reset'&&i.id==G.host){G.phase='lobby';G.log=[];G.pend=null;G.lose=null;G.players.forEach(p=>{p.coins=2;p.cards=[]});return}
 if(G.phase=='lobby'){if(k=='start'&&i.id==G.host&&G.players.length>1){G.deck=[];['Duke','Assassin','Captain','Ambassador','Contessa'].forEach(n=>{for(let j=0;j<3;j++)G.deck.push(n)});shuf(G.deck);G.players.forEach(p=>{p.coins=2;p.cards=[{n:G.deck.pop(),x:0},{n:G.deck.pop(),x:0}]});G.turn=Math.random()*G.players.length|0;G.phase='play';G.pend=null;G.lose=null;G.log=['The game begins. Trust no one.']}return}
 if(G.phase!='play')return;
 if(k=='lose'&&G.lose==i.id){const c=me.cards[i.v];if(c&&!c.x){c.x=1;lg(me.name+' loses '+c.n);fin(G.after)}return}
 if(G.lose)return;
 if(k=='act'&&!pd&&G.players[G.turn].id==i.id){const a=ACT[i.a];if(!a||(me.coins>=10&&i.a!='coup')||me.coins<(a.cost||0))return;let t=null;
  if(a.t){t=P(i.t);if(!t||t.id==me.id||!live(t).length)return}
  me.coins-=a.cost||0;G.pend={act:i.a,actor:me.id,target:t?t.id:null,stage:'decl',passed:[]};
  lg(me.name+(a.c?' claims '+a.c+': ':': ')+a.l+(t?' → '+t.name:''));
  if(i.a=='income'||i.a=='coup')exec();return}
 if(!pd||!live(me).length)return;
 if(k=='keep'&&pd.stage=='ex'&&pd.actor==me.id){const n=live(me).length,v=[...new Set(i.v)];if(v.length!=n||v.some(x=>!(x>=0&&x<G.ex.length)))return;
  const kept=v.map(x=>G.ex[x]),rest=G.ex.filter((_,x)=>!v.includes(x));G.deck.push(...rest);shuf(G.deck);me.cards=me.cards.filter(c=>c.x).concat(kept.map(n=>({n,x:0})));lg(me.name+' exchanges cards');next();return}
 if(pd.stage=='ex')return;
 const who=pd.stage=='blk'?pd.blocker:pd.actor;if(me.id==who)return;
 if(k=='pass'){if(!pd.passed.includes(me.id))pd.passed.push(me.id);ready();return}
 if(k=='block'&&pd.stage=='decl'){const a=ACT[pd.act];if(!a.b||!a.b.includes(i.c)||(pd.act!='aid'&&pd.target!=me.id))return;pd.stage='blk';pd.blocker=me.id;pd.bc=i.c;pd.passed=[];lg(me.name+' blocks with '+i.c);return}
 if(k=='chal'){const d=pd.stage=='decl';if(d&&(pd.ch||!ACT[pd.act].c))return;
  const cl=P(d?pd.actor:pd.blocker),ch=d?ACT[pd.act].c:pd.bc,card=live(cl).find(c=>c.n==ch);lg(me.name+' challenges '+cl.name+'’s '+ch+'!');
  if(card){G.rv={who:cl.id,n:ch};lg(cl.name+' reveals '+ch+' and draws a new card.');G.deck.push(card.n);shuf(G.deck);card.n=G.deck.pop();lose(me.id,d?'cont':'bstand')}
  else{lg(cl.name+' was bluffing!');lose(cl.id,d?'afail':'bfail')}}}

/* ---------- networking (PeerJS, no login) ---------- */
const rc=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join(''),PID=c=>'coupx-'+c;
function view(id){const v=JSON.parse(JSON.stringify(G));delete v.deck;v.dn=G.deck.length;
 v.players.forEach(p=>{if(p.id!=id&&G.phase!='over')p.cards=p.cards.map(c=>c.x?c:{n:null,x:0})});
 if(v.pend&&v.pend.stage=='ex'&&v.pend.actor!=id)v.ex=null;return v}
function bcast(){for(const id in conns)if(conns[id].open)conns[id].send({t:'s',G:view(id)})}
function run(i){const was=G.phase;proc(i);if(was!='play'&&G.phase=='play')deal=true;bcast();draw();deal=false}
function send(i){i.id=uid;if(isHost)run(i);else if(hc&&hc.open)hc.send(i)}
function host(){code=rc();peer=new Peer(PID(code));
 peer.on('open',()=>{isHost=true;G={host:uid,phase:'lobby',players:[{id:uid,name:myName,coins:2,cards:[]}],log:[],deck:[]};try{location.hash=code}catch(e){}draw()});
 peer.on('connection',c=>c.on('data',d=>{conns[d.id]=c;run(d)}));
 peer.on('error',e=>{if(e.type=='unavailable-id'){peer.destroy();host()}else{msg='Network error: '+e.type;G=null;land()}})}
function join(c){code=c;peer=new Peer();const t=setTimeout(()=>{if(!hc||!hc.open){msg='Could not reach the room. Check the code.';G=null;land()}},10000);
 peer.on('open',()=>{hc=peer.connect(PID(c),{reliable:true});hc.on('open',()=>{clearTimeout(t);send({k:'join',name:myName})});
  hc.on('data',m=>{if(m.t!='s')return;const pv=G;G=m.G;if(!pv||(pv.phase!='play'&&G.phase=='play'))deal=true;draw();deal=false});
  hc.on('close',()=>{msg='Disconnected from the host.';G=null;land()})});
 peer.on('error',e=>{clearTimeout(t);msg=e.type=='peer-unavailable'?'Room not found. Check the code.':'Network error: '+e.type;G=null;land()})}
/* ---------- UI ---------- */
function card(n,o={}){return`<div class="cd${n?'':' down'}${o.sm?' sm':''}${o.c?' '+o.c:''}${o.deal?' deal':''}${o.m?' mine':''}${o.dead?' dead':''}${o.pick?' pick':''}${o.sel?' sel':''}" ${o.a?`data-a="${o.a}" data-v="${o.v}"`:''} style="--d:${o.d||0}s;--f:${o.f||0}s"><div class="in"><div class="fc fr" ${n?`style="background-image:url(${IMG[n]})"`:''}></div><div class="fc bk"><span>COUP</span></div></div></div>`}
function coins(n,cap){const v=Math.min(n,cap||99);let h='';for(let c=0;c<v;c+=5)h+=`<div class="col">${'<i></i>'.repeat(Math.min(5,v-c))}</div>`;return`<div class="stack">${h}<b>${n}</b></div>`}
function btn(a,v,l,s,cls,x=''){return`<button class="btn ${cls||''}" data-a="${a}" data-v="${v}" ${x}>${l}${s?`<small>${s}</small>`:''}</button>`}
function land(){app.innerHTML=`<img class="lg big" src="${IMG.logo}" alt="COUP"><div class="tag">Bluff · Challenge · Seize Power</div><div class="grid"><div class="pan"><h3>Your Alias</h3><input id="nm" maxlength="14" placeholder="Enter your name" value="${esc(myName)}"><div style="margin-top:12px">${btn('create','','Create Room','','p')}</div></div><div class="pan"><h3>Join a Room</h3><input id="cd" maxlength="4" placeholder="ROOM CODE" style="text-transform:uppercase" value="${esc(location.hash.slice(1,5).toUpperCase())}"><div style="margin-top:12px">${btn('join','','Join Room','','c')}</div></div></div><div class="err">${esc(msg)}</div><div class="fan">${NAMES.map((n,i)=>card(n,{deal:1,m:1,d:i*.12,f:.7+i*.12})).join('')}</div>`}
function seat(p,x,y,me,idx){const own=p.id==uid,pl=G.phase!='lobby',turn=G.phase=='play'&&G.players[G.turn].id==p.id,out=pl&&!live(p).length;
 const dx=`calc(var(--W)*${((50-x)/100).toFixed(3)})`,dy=`calc(var(--H)*${((43-y)/100).toFixed(3)})`;
 const cs=p.cards.map((c,i)=>{const d=(idx*2+i)*.18;if(me)return card(c.n,{dead:c.x,deal,m:1,d,f:1.4+i*.45,pick:G.lose==uid&&own&&!c.x,a:G.lose==uid&&own&&!c.x?'lose':'',v:i});
  return card(c.x||G.phase=='over'?c.n:null,{sm:1,dead:c.x,deal,d})}).join('');
 return`<div class="seat${me?' me':''}${turn?' turn':''}${out?' out':''}" style="${me?'':`left:${x}%;top:${y}%;`}--dx:${dx};--dy:${dy}"><div class="plate">${esc(p.name)}${own?' · you':''}${p.id==G.host?' ★':''}</div><div class="hr"><div class="hand">${cs}</div>${pl?coins(p.coins):''}</div></div>`}
function center(){
 if(G.phase=='lobby')return`<div class="code">${code}</div><div class="mut">ROOM CODE · ${G.players.length}/6 SEATED</div><div>${btn('copy','','Copy Link','','c')}${isHost?btn('start','','Start','','p',G.players.length>1?'':'disabled'):''}</div><div class="mut">${isHost?(G.players.length>1?'':'Waiting for friends to sit down…'):'Waiting for the host to start…'}</div>`;
 if(G.phase=='over')return`<div class="win">${nm(G.win)}<br>seizes power!</div>`+(isHost?btn('reset','','Back to Lobby','','p'):'');
 const pd=G.pend,cur=G.players[G.turn],tr=50-G.players.reduce((s,p)=>s+p.coins,0),dn=G.deck?G.deck.length:G.dn;
 const rv=G.rv?`<div class="rvw">${card(G.rv.n,{c:'rv'})}<small>${nm(G.rv.who)} reveals ${G.rv.n}</small></div>`:'';
 const ban=pd?`<b>${nm(pd.actor)}</b> → ${ACT[pd.act].l}${pd.target?' on <b>'+nm(pd.target)+'</b>':''}${pd.stage=='blk'?` · <b>${nm(pd.blocker)}</b> blocks as ${pd.bc}`:''}`:`<b>${esc(cur.name)}</b>’s turn`;
 return`<div class="piles"><div class="dk"><div class="deckp">${card(null,{sm:1})+card(null,{sm:1})+card(null,{sm:1})}</div><small>COURT · ${dn}</small></div>${rv}<div class="dk">${coins(tr,15)}<small>TREASURY</small></div></div><div class="bn">${ban}</div>`}
function table(){const mi=Math.max(0,G.players.findIndex(p=>p.id==uid)),ord=[...G.players.slice(mi),...G.players.slice(0,mi)],oth=ord.slice(1),k=oth.length,step=Math.min(46,190/Math.max(k,1));
 let h=`<div class="tbl"><div class="felt"></div><div class="mid">${center()}</div>`;
 oth.forEach((p,i)=>{const a=(270+(i-(k-1)/2)*step)*Math.PI/180;h+=seat(p,Math.max(14,Math.min(86,50+44*Math.cos(a))),46+36*Math.sin(a),0,i+1)});
 return h+seat(ord[0],50,84,1,0)+'</div>'}
function panel(){const me=P(uid),pd=G.pend,cur=G.players[G.turn],W=t=>`<p class="say mut">${t}</p>`;
 if(!me)return W('Spectating…');
 if(G.lose)return G.lose==uid?`<p class="say"><b>You lose an influence.</b> Tap one of your cards on the table.</p>`:W(nm(G.lose)+' is choosing a card to lose…');
 if(pd&&pd.stage=='ex')return pd.actor==uid?`<p class="say"><b>Exchange:</b> keep ${live(me).length} card(s)</p><div style="display:flex;gap:8px;flex-wrap:wrap">${G.ex.map((n,i)=>card(n,{c:'md',sel:keep.includes(i),a:'kp',v:i})).join('')}</div>`+btn('keepok','','Confirm','','p',keep.length==live(me).length?'':'disabled'):W(nm(pd.actor)+' is exchanging cards…');
 if(pd){const a=ACT[pd.act],bl=pd.stage=='blk',who=bl?pd.blocker:pd.actor;
  const s=`<p class="say"><b>${nm(pd.actor)}</b> → ${a.l}${pd.target?' on <b>'+nm(pd.target)+'</b>':''}${bl?` · <b>${nm(pd.blocker)}</b> blocks as ${pd.bc}`:''}</p>`;
  if(uid==who||!live(me).length||pd.passed.includes(uid))return s+W('Waiting for the others…');
  let h='';if(bl)h+=btn('chal','','Challenge',pd.bc,'x');else{if(a.c&&!pd.ch)h+=btn('chal','','Challenge',a.c,'x');if(a.b&&(pd.act=='aid'||pd.target==uid))h+=a.b.map(c=>btn('blk',c,'Block','as '+c,'c')).join('')}
  return s+h+btn('pass','','Allow','','')}
 if(cur.id!=uid)return W('<b>'+esc(cur.name)+'</b>’s turn…');
 if(sel)return`<p class="say"><b>${ACT[sel].l}</b> — choose a target</p>`+G.players.filter(p=>p.id!=uid&&live(p).length).map(p=>btn('tgt',p.id,esc(p.name),p.coins+' coins','p')).join('')+btn('cancel','','Back');
 const f=me.coins>=10;return`<p class="say"><b>Your turn.</b>${f?' You hold 10+ coins — you must Coup.':''}</p>`+Object.keys(ACT).map(k=>btn('act',k,ACT[k].l,ACT[k].s,'',(f&&k!='coup')||me.coins<(ACT[k].cost||0)?'disabled':'')).join('')}
function draw(){if(!G)return land();const lobby=G.phase=='lobby';
 app.innerHTML=`<img class="lg" src="${IMG.logo}" alt="COUP">`+table()+(lobby||G.phase=='over'?'':`<div class="pan"><h3>Command</h3>${panel()}</div>`)+(lobby?'':`<div class="pan"><h3>Table Talk</h3><div class="log" id="lg">${G.log.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`);
 const l=$('#lg');if(l)l.scrollTop=1e5}
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='create'||a=='join'){if(typeof Peer=='undefined'){msg='Could not load the network library. Check your connection.';return land()}
  myName=($('#nm').value.trim()||'Agent').slice(0,14);ls('cn',myName);msg='';
  if(a=='create')return host();const c=$('#cd').value.trim().toUpperCase();if(c.length!=4){msg='Enter the 4-letter code.';myName=myName;return land()}return join(c)}
 if(a=='copy'){try{navigator.clipboard.writeText(location.href.split('#')[0]+'#'+code);b.firstChild.textContent='Copied!'}catch(x){}return}
 if(a=='act'){if(ACT[v].t){sel=v;return draw()}return send({k:'act',a:v})}
 if(a=='tgt'){const s=sel;sel=null;return send({k:'act',a:s,t:v})}
 if(a=='cancel'){sel=null;return draw()}
 if(a=='kp'){const i=+v;keep=keep.includes(i)?keep.filter(x=>x!=i):[...keep,i];return draw()}
 if(a=='keepok'){const k=keep;keep=[];return send({k:'keep',v:k})}
 if(a=='lose')return send({k:'lose',v:+v});
 if(a=='blk')return send({k:'block',c:v});
 send({k:a})});
land();
</script></body></html>
